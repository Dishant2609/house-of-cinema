[build]
  base = "/"
  command = "cd packages/web && bun install && bun run build"
  publish = "packages/web/dist"

[build.environment]
  NODE_VERSION = "20"
  BUN_VERSION = "1.3.5"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
